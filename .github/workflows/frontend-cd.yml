# ═══════════════════════════════════════════════════════════════════════════
# TechShop — Frontend CD
# Deploy frontend lên Vercel tự động khi push lên main
#
# Secrets cần thiết:
#   - VERCEL_TOKEN:   Token từ Vercel dashboard
#   - VERCEL_ORG_ID:  Organization ID (vercel.json hoặc dashboard)
#   - VERCEL_PROJECT_ID: Project ID
# ═══════════════════════════════════════════════════════════════════════════
name: Frontend CD

on:
  push:
    branches: [main, master]
    paths:
      - 'techshop-frontend/**'
      - '.github/workflows/frontend-cd.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: techshop-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: techshop-frontend

      - name: Build
        run: npm run build
        working-directory: techshop-frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: techshop-frontend
          vercel-args: '--prod'
