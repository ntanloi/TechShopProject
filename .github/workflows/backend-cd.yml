# ═══════════════════════════════════════════════════════════════════════════
# TechShop — Backend CD (Continuous Deployment)
# Tự động deploy lên EC2 sau khi CI build xanh.
#
# Flow: CI xanh → SSH vào EC2 → git pull → tạo .env → docker compose up --build
#
# Secrets cần thiết (GitHub → Settings → Secrets → Actions):
#   - EC2_HOST             : IP public của EC2 (VD: 54.123.45.67)
#   - EC2_USER             : SSH username (thường là: ubuntu)
#   - EC2_SSH_KEY          : Nội dung file .pem (private key)
#   - JWT_SECRET           : JWT secret key
#   - CLOUDINARY_CLOUD_NAME: Cloudinary cloud name
#   - CLOUDINARY_API_KEY   : Cloudinary API key
#   - CLOUDINARY_API_SECRET: Cloudinary API secret
#   - VNPAY_TMN_CODE       : VNPay terminal code
#   - VNPAY_HASH_SECRET    : VNPay hash secret
#   - MAIL_USERNAME        : Gmail address
#   - MAIL_PASSWORD        : Gmail app password
#   - GEMINI_API_KEY       : Google Gemini API key
# ═══════════════════════════════════════════════════════════════════════════
name: Backend CD

on:
  # Tự động chạy sau khi CI thành công trên main/master
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main, master]

  # Trigger thủ công (có thể chọn branch)
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch để deploy'
        required: false
        default: 'main'
      environment:
        description: 'Môi trường deploy (staging / production)'
        required: false
        default: 'production'

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    # Chỉ deploy khi CI thành công hoặc trigger thủ công
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.event.workflow_run.head_branch || 'main' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          VNPAY_TMN_CODE: ${{ secrets.VNPAY_TMN_CODE }}
          VNPAY_HASH_SECRET: ${{ secrets.VNPAY_HASH_SECRET }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 600s
          envs: DEPLOY_BRANCH,JWT_SECRET,CLOUDINARY_CLOUD_NAME,CLOUDINARY_API_KEY,CLOUDINARY_API_SECRET,VNPAY_TMN_CODE,VNPAY_HASH_SECRET,MAIL_USERNAME,MAIL_PASSWORD,GEMINI_API_KEY,EC2_HOST
          script: |
            set -e
            echo "🚀 ===== Deploying TechShop Backend ====="
            echo "📌 Branch: $DEPLOY_BRANCH"
            echo "🕐 Time: $(date '+%Y-%m-%d %H:%M:%S')"

            # ── 1. Di chuyển vào thư mục project ──────────────────────────
            cd ~/TechShopProject || { echo "❌ Project directory not found"; exit 1; }

            # ── 2. Lưu commit hiện tại để rollback nếu cần ────────────────
            PREV_COMMIT=$(git rev-parse HEAD)
            echo "📌 Previous commit: $PREV_COMMIT"

            # ── 3. Pull code mới nhất ──────────────────────────────────────
            echo "📥 Pulling latest code from $DEPLOY_BRANCH..."
            git fetch origin
            git checkout "$DEPLOY_BRANCH"
            git pull origin "$DEPLOY_BRANCH"
            echo "✅ Now at commit: $(git rev-parse HEAD)"

            # ── 4. Tạo file .env (dùng printf để tránh vấn đề heredoc) ────
            echo "📝 Writing .env file..."
            printf '%s\n' \
              "JWT_SECRET=${JWT_SECRET}" \
              "CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}" \
              "CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}" \
              "CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}" \
              "VNPAY_TMN_CODE=${VNPAY_TMN_CODE}" \
              "VNPAY_HASH_SECRET=${VNPAY_HASH_SECRET}" \
              "MAIL_USERNAME=${MAIL_USERNAME}" \
              "MAIL_PASSWORD=${MAIL_PASSWORD}" \
              "GEMINI_API_KEY=${GEMINI_API_KEY}" \
              "PAYMENT_RETURN_URL=http://${EC2_HOST}:5173/payment-result" \
              > .env
            echo "✅ .env written ($(wc -l < .env) lines)"

            # ── 5. Build & restart services ────────────────────────────────
            echo "🐳 Building & restarting all services..."
            docker compose pull --ignore-pull-failures || true
            docker compose up -d --build --remove-orphans

            # ── 6. Chờ services khởi động ──────────────────────────────────
            echo "⏳ Waiting 90s for services to start..."
            sleep 90

            # ── 7. Health checks ───────────────────────────────────────────
            echo "🩺 ===== Health Checks ====="
            FAILED=0

            check_health() {
              local name=$1
              local url=$2
              if curl -sf --max-time 10 "$url" > /dev/null 2>&1; then
                echo "  ✅ $name"
              else
                echo "  ❌ $name — $url"
                FAILED=$((FAILED + 1))
              fi
            }

            check_health "Discovery Service  (8761)" "http://localhost:8761/actuator/health"
            check_health "Gateway Service    (8080)" "http://localhost:8080/actuator/health"
            check_health "User Service       (8081)" "http://localhost:8081/actuator/health"
            check_health "Product Service    (8082)" "http://localhost:8082/actuator/health"
            check_health "Order Service      (8083)" "http://localhost:8083/actuator/health"
            check_health "Cart Service       (8084)" "http://localhost:8084/actuator/health"
            check_health "Payment Service    (8085)" "http://localhost:8085/actuator/health"
            check_health "Notification Svc   (8086)" "http://localhost:8086/actuator/health"
            check_health "Review Service     (8087)" "http://localhost:8087/actuator/health"
            check_health "Inventory Service  (8088)" "http://localhost:8088/actuator/health"
            check_health "AI Service         (8089)" "http://localhost:8089/actuator/health"

            echo ""
            echo "📊 Container status:"
            docker compose ps

            # ── 8. Rollback nếu critical services fail ─────────────────────
            if [ $FAILED -gt 3 ]; then
              echo ""
              echo "🔴 Too many services failed ($FAILED). Rolling back to $PREV_COMMIT..."
              git checkout "$PREV_COMMIT"
              docker compose up -d --build --remove-orphans
              echo "⚠️  Rolled back. Please check logs: docker compose logs"
              exit 1
            fi

            echo ""
            if [ $FAILED -eq 0 ]; then
              echo "🎉 Deploy complete! All services healthy."
            else
              echo "⚠️  Deploy complete with $FAILED service(s) not yet healthy."
              echo "    They may still be starting. Check: docker compose logs <service>"
            fi
