# ═══════════════════════════════════════════════════════════════════════════
# TechShop — Backend CI (Continuous Integration)
# Build tất cả microservices bằng Maven khi có push/PR lên main/develop
# Services: common-lib, discovery, gateway, user, product, order, cart,
#           payment, notification, review, inventory, ai-service
# ═══════════════════════════════════════════════════════════════════════════
name: Backend CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'techshop-microservice/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'techshop-microservice/**'

jobs:
  build:
    name: Build Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # common-lib phải được install trước vì các service khác depend vào
      - name: Build & install common-lib
        run: mvn -B clean install -DskipTests
        working-directory: techshop-microservice/common-lib

      # Build tất cả services (bao gồm ai-service nằm trong parent pom)
      - name: Build all microservices
        run: mvn -B clean package -DskipTests
        working-directory: techshop-microservice

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build-artifacts-${{ github.run_number }}
          path: techshop-microservice/**/target/*.jar
          retention-days: 1

      - name: Build summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
