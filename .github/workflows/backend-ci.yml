# ═══════════════════════════════════════════════════════════════════════════
# TechShop — Backend CI (Continuous Integration)
# Build tất cả microservices bằng Maven khi có push/PR lên main
# ═══════════════════════════════════════════════════════════════════════════
name: Backend CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'techshop-microservice/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'techshop-microservice/**'

jobs:
  build:
    name: Build Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build common-lib
        run: mvn -B clean install -DskipTests
        working-directory: techshop-microservice/common-lib

      - name: Build all services
        run: mvn -B clean package -DskipTests
        working-directory: techshop-microservice

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build-artifacts
          path: techshop-microservice/**/target/*.jar
          retention-days: 1
