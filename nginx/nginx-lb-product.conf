# ──────────────────────────────────────────────────────────────────────────────
# NGINX Load Balancer THUẦN cho product-service (CHỈ dùng để test scale + LB)
# ──────────────────────────────────────────────────────────────────────────────
# • KHÔNG rate limit (khác nginx.conf chính) → đo được capacity thật của 2 instance.
# • Bỏ qua gateway + token bucket → request không bị 429 chặn.
# • Gắn header X-Upstream-Addr = IP:port instance đã phục vụ → k6 biết LB chia cho ai.
#
# Cách hoạt động: dùng Docker embedded DNS (127.0.0.11) resolve tên service
# 'product-service'. Khi scale, Docker DNS trả về NHIỀU IP (mỗi replica 1 IP),
# nginx round-robin giữa chúng → load balancing thật giữa các instance.
# ──────────────────────────────────────────────────────────────────────────────

worker_processes auto;
events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    default_type application/json;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Log kèm upstream để soi instance nào phục vụ (rt=tổng, urt=thời gian upstream).
    log_format lb '$remote_addr [$time_local] "$request" $status '
                  'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/lb-access.log lb;

    # Docker embedded DNS. valid=1s để nginx liên tục re-resolve, thấy đủ replica khi scale.
    resolver 127.0.0.11 valid=1s ipv6=off;

    server {
        listen 80;
        server_name _;

        # k6 đọc header này để biết request do instance (IP:port) nào phục vụ.
        add_header X-Upstream-Addr $upstream_addr always;

        # Health check riêng của nginx (không đụng tới service).
        location /lb-health {
            access_log off;
            return 200 "lb-ok\n";
            add_header Content-Type text/plain;
        }

        # Toàn bộ traffic forward thẳng tới product-service, KHÔNG rate limit.
        # MẸO docker-compose: đặt host vào BIẾN + có resolver → nginx resolve DNS
        # lúc chạy. Docker DNS trả nhiều IP (mỗi replica 1 IP) và xoay vòng round-robin
        # → tải chia đều cho các instance mà không cần nginx Plus.
        location / {
            set $product_backend "product-service:8082";
            proxy_pass http://$product_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Nếu 1 instance lỗi/timeout, thử instance còn lại (chứng minh fault tolerance).
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
