# Redis Configuration for TechShop

# Persistence
appendonly yes
appendfilename "appendonly.aof"
save 900 1
save 300 10
save 60 10000

# Logging
loglevel notice
logfile ""

# Keyspace notifications - Log cache operations
notify-keyspace-events "KEA"

# Slowlog - Log ALL commands (set to 0 microseconds)
slowlog-log-slower-than 0
slowlog-max-len 1000

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Network
bind 0.0.0.0
protected-mode no
port 6379

# Performance
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Limits
maxclients 10000
