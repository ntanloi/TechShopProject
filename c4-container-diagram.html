<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <title>TechShop – C4 Container Diagram</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      text-align: center;
      font-size: 1.6rem;
      color: #00d4ff;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }
    .subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 24px;
    }
    /* ── Legend ── */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 28px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: #ccc;
    }
    .legend-box {
      width: 18px; height: 18px;
      border-radius: 4px;
      border: 2px solid rgba(255,255,255,0.25);
    }
    /* ── Diagram canvas ── */
    .diagram {
      position: relative;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
    /* ── Tooltip ── */
    .tooltip {
      position: fixed;
      background: #0f3460;
      border: 1px solid #00d4ff;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.8rem;
      color: #e0e0e0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      max-width: 260px;
      z-index: 999;
      line-height: 1.5;
    }
    .tooltip.show { opacity: 1; }
    .tooltip strong { color: #00d4ff; display: block; margin-bottom: 4px; }
  </style>
</head>
<body>
<h1>🏗️ TechShop – C4 Container Diagram</h1>
<p class="subtitle">Kiến trúc Microservices · Spring Boot · React · Docker</p>

<div class="legend">
  <div class="legend-item"><div class="legend-box" style="background:#1565c0"></div> Spring Boot Service</div>
  <div class="legend-item"><div class="legend-box" style="background:#2e7d32"></div> MySQL Database</div>
  <div class="legend-item"><div class="legend-box" style="background:#b71c1c"></div> Redis Cache</div>
  <div class="legend-item"><div class="legend-box" style="background:#4a148c"></div> Frontend (React)</div>
  <div class="legend-item"><div class="legend-box" style="background:#e65100"></div> NGINX / Gateway</div>
  <div class="legend-item"><div class="legend-box" style="background:#37474f"></div> External System</div>
  <div class="legend-item"><div class="legend-box" style="background:#006064"></div> Service Discovery</div>

<div class="diagram">

      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- BACKGROUND ZONES -->
  <!-- ═══════════════════════════════════════════════════ -->

  <!-- Outer system boundary -->

  <!-- Docker Network zone -->

  <text x="238" y="72" font-size="11" fill="#64b5f6">Docker Network: techshop-network</text>

  <!-- Microservices zone -->
  <rect x="380" y="200" width="780" height="500" rx="10" fill="#071a2e" stroke="#263238" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="396" y="220" font-size="10" fill="#546e7a">Microservices (Spring Boot · Eureka)</text>

  <!-- Databases zone -->
  <rect x="380" y="720" width="780" height="180" rx="10" fill="#071a2e" stroke="#1b5e20" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="396" y="740" font-size="10" fill="#388e3c">Databases (MySQL 8.0 · Redis)</text>

  <!-- External zone -->

  <text x="36" y="72" font-size="10" fill="#ff8a65">External / Users</text>


  <!-- ═══════════════════════════════════════════════════ -->
  <!-- EXTERNAL ACTORS (left column) -->
  <!-- ═══════════════════════════════════════════════════ -->

  <!-- User (Browser) -->

    <circle cx="112" cy="130" r="22" fill="#4a148c" stroke="#ce93d8" stroke-width="2" filter="url(#shadow)"/>
    <text x="112" y="125" text-anchor="middle" font-size="18">👤</text>
    <text x="112" y="145" text-anchor="middle" font-size="9" fill="#ce93d8">User</text>
    <rect x="52" y="155" width="120" height="44" rx="6" fill="#4a148c" stroke="#ce93d8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="112" y="172" text-anchor="middle" font-size="9" fill="#e1bee7" font-weight="bold">React Frontend</text>
    <text x="112" y="184" text-anchor="middle" font-size="8" fill="#ce93d8">Vite · Tailwind · Zustand</text>
    <text x="112" y="194" text-anchor="middle" font-size="8" fill="#9e9e9e">:5173</text>
  </g>

  <!-- Admin -->
  <g class="node" data-tip="<strong>Admin</strong>Quản trị viên sử dụng Admin Dashboard để quản lý sản phẩm, đơn hàng, người dùng, kho hàng.">

    <text x="112" y="275" text-anchor="middle" font-size="18">🛡️</text>

  <!-- External services -->

    <text x="112" y="400" text-anchor="middle" font-size="14">💳</text>

    <text x="112" y="540" text-anchor="middle" font-size="14">📧</text>

    <text x="112" y="564" text-anchor="middle" font-size="8" fill="#90a4ae">Email Service</text>
  </g>

  <g class="node" data-tip="<strong>Google Gemini API</strong>Mô hình AI của Google. AI Service sử dụng để cung cấp chatbot tư vấn sản phẩm.">

    <text x="590" y="610" text-anchor="middle" font-size="14">🤖</text>
    <text x="112" y="610" text-anchor="middle" font-size="14">🤖</text>
    <text x="112" y="624" text-anchor="middle" font-size="9" fill="#eceff1" font-weight="bold">Google Gemini</text>
    <text x="112" y="634" text-anchor="middle" font-size="8" fill="#90a4ae">AI / LLM API</text>
  </g>


  <!-- ═══════════════════════════════════════════════════ -->
  <!-- NGINX + GATEWAY (entry layer) -->
  <!-- ═══════════════════════════════════════════════════ -->

  <!-- NGINX -->

    <text x="295" y="122" text-anchor="middle" font-size="13">🔀</text>
    <text x="295" y="138" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">NGINX</text>
    <text x="295" y="150" text-anchor="middle" font-size="8" fill="#ffccbc">Load Balancer · :80</text>
  </g>

  <!-- API Gateway -->
  <g class="node" data-tip="<strong>API Gateway :8080</strong>Spring Cloud Gateway. Định tuyến tất cả /api/* đến các microservice tương ứng. JWT validation, circuit breaker. Đăng ký với Eureka.">
    <rect x="390" y="100" width="140" height="60" rx="8" fill="#e65100" stroke="#ff8a65" stroke-width="2" filter="url(#shadow)"/>
    <text x="460" y="122" text-anchor="middle" font-size="13">🚪</text>
    <text x="460" y="138" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">API Gateway</text>
    <text x="460" y="150" text-anchor="middle" font-size="8" fill="#ffccbc">Spring Cloud Gateway · :8080</text>
  </g>

  <!-- Eureka Discovery -->
  <g class="node" data-tip="<strong>Eureka Discovery :8761</strong>Service Registry. Tất cả microservice đăng ký tại đây. Gateway dùng để resolve service name → host:port.">

    <text x="630" y="122" text-anchor="middle" font-size="13">🗺️</text>

    <text x="630" y="150" text-anchor="middle" font-size="8" fill="#b2ebf2">Service Registry · :8761</text>
  </g>


  <!-- ═══════════════════════════════════════════════════ -->

  <!-- ═══════════════════════════════════════════════════ -->

  <!-- Row 1: User, Product, Order -->

    <rect x="700" y="230" width="130" height="58" rx="7" fill="#1565c0" stroke="#64b5f6" stroke-width="1.5" filter="url(#shadow)"/>

<!-- Tooltip element -->
<div class="tooltip" id="tooltip"></div>

<script>
  const tooltip = document.getElementById('tooltip');
  document.querySelectorAll('.node').forEach(node => {
    const tip = node.getAttribute('data-tip');
    if (!tip) return;
    node.style.cursor = 'pointer';
    node.addEventListener('mouseenter', (e) => {
      tooltip.innerHTML = tip;
      tooltip.classList.add('show');
    });
    node.addEventListener('mousemove', (e) => {
      let x = e.clientX + 14, y = e.clientY + 14;
      if (x + 270 > window.innerWidth) x = e.clientX - 280;
      if (y + 120 > window.innerHeight) y = e.clientY - 120;
      tooltip.style.left = x + 'px';
      tooltip.style.top = y + 'px';
    });
    node.addEventListener('mouseleave', () => {
      tooltip.classList.remove('show');
    });
  });
</script>
