# Docker Compose Scale Override
# Implements Scalability requirement
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.scale.yml up -d --scale product-service=3
#
# Notes:
# - Only product-service is configured to scale via this file (demo target).
# - Other services keep their fixed container_name from docker-compose.yml.
# - Resource limits via mem_limit / cpus apply at runtime in compose mode (not Swarm).

services:
  # ==========================================
  # PRODUCT SERVICE - Can scale horizontally
  # ==========================================
  product-service:
    # Clear the fixed container_name from the base file so multiple replicas can run.
    # Requires Docker Compose v2.13+ for !reset directive.
    container_name: !reset null
    # Dynamic host port (let Docker pick one per replica)
    ports: !override
      - "8082"
    # Runtime resource limits (works in compose mode, no Swarm needed)
    mem_limit: 1g
    mem_reservation: 512m
    cpus: 1.0
    restart: on-failure

networks:
  techshop-network:
    driver: bridge

volumes:
  mysql-user-data:
  mysql-product-data:
  mysql-order-data:
  mysql-cart-data:
  mysql-payment-data:
  mysql-notification-data:
  mysql-inventory-data:
  redis-data:
