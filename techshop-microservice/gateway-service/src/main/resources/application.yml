server:
  port: 8080

spring:
  application:
    name: gateway-service
  main:
    web-application-type: reactive
  # Redis for Rate Limiting
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000

  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedOriginPatterns:
              - "https://*.vercel.app"
            allowedMethods: ["*"]
            allowedHeaders: ["*"]
            allowCredentials: true

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

      routes:
        # ======================================================
        # Auth & User Service (Higher rate limit for auth)
        # ======================================================
        - id: user-auth
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10  # tokens per second
                redis-rate-limiter.burstCapacity: 20  # max burst
                redis-rate-limiter.requestedTokens: 1 # tokens per request
                key-resolver: "#{@ipKeyResolver}"

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # ======================================================
        # Product Service (High traffic expected)
        # ======================================================
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**, /api/categories/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: default
                fallbackUri: forward:/fallback/products
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET
                exceptions:
                  - java.io.IOException
                  - org.springframework.cloud.gateway.support.TimeoutException
                  - org.springframework.cloud.gateway.support.NotFoundException
                backoff:
                  firstBackoff: 1000ms
                  maxBackoff: 5000ms
                  factor: 2
                  basedOnPreviousValue: true

        # ======================================================
        # Order Service (Moderate rate limit)
        # ======================================================
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: default
                fallbackUri: forward:/fallback/orders
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET
                exceptions:
                  - java.io.IOException
                  - org.springframework.cloud.gateway.support.TimeoutException
                  - org.springframework.cloud.gateway.support.NotFoundException
                backoff:
                  firstBackoff: 1000ms
                  maxBackoff: 5000ms
                  factor: 2
                  basedOnPreviousValue: true

        # ======================================================
        # Cart Service
        # ======================================================
        - id: cart-service
          uri: lb://order-service
          predicates:
            - Path=/api/cart/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: default
                fallbackUri: forward:/fallback/cart
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET
                exceptions:
                  - java.io.IOException
                  - org.springframework.cloud.gateway.support.TimeoutException
                  - org.springframework.cloud.gateway.support.NotFoundException
                backoff:
                  firstBackoff: 1000ms
                  maxBackoff: 5000ms
                  factor: 2
                  basedOnPreviousValue: true

        # ======================================================
        # Payment Service (Strict rate limit for security)
        # ======================================================
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 5
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # ======================================================
        # Notification Service
        # ======================================================
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # ======================================================
        # Review Service
        # ======================================================
        - id: review-service
          uri: lb://product-service
          predicates:
            - Path=/api/reviews/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # ======================================================
        # Inventory Service
        # ======================================================
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # ======================================================
        # AI Service
        # ======================================================
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:techshop-super-secret-key-change-in-production-2024}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.filter.factory.RetryGatewayFilterFactory: TRACE
    reactor.netty.http.client: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
# Resilience4j Configuration for Retry and Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      default:
        # --- Testing-friendly thresholds (production: tăng sliding-window-size lên 20+) ---
        sliding-window-size: 5          # Chỉ cần 5 calls để tính failure rate
        minimum-number-of-calls: 3      # CB bắt đầu đánh giá sau 3 calls
        failure-rate-threshold: 60      # Mở CB khi >60% fail
        slow-call-rate-threshold: 100    # Coi là chậm nếu >80% call vượt slow-call-duration
        slow-call-duration-threshold: 5s
        wait-duration-in-open-state: 15s   # Giảm xuống 15s để test HALF-OPEN nhanh hơn
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        record-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - java.net.ConnectException
          - reactor.netty.http.client.PrematureCloseException
          - io.netty.channel.ConnectTimeoutException
  
  retry:
    instances:
      default:
        max-attempts: 3
        wait-duration: 3s  # Wait 3 seconds between retries
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.net.ConnectException
          - java.net.SocketTimeoutException
          - org.springframework.web.client.ResourceAccessException
  
  timelimiter:
    instances:
      default:
        timeout-duration: 10s